serenity {
  project.name = "QAXpert - Screenplay Automation"
  take.screenshots = FOR_FAILURES
}

webdriver {
  driver = appium
  base.url = "http://127.0.0.1:4723"
}

appium {
  hub = "http://127.0.0.1:4723/wd/hub"
  platformName = "Android"
  platformVersion = "16.0.0"
  deviceName = "R5GYA1MKNWX"
  automationName = "UiAutomator2"
  appPackage = "com.saucelabs.mydemoapp.android"
  appActivity = ".view.activities.SplashActivity"
  noReset = false
  fullReset = false
  newCommandTimeout = 300
}

headless.mode = false
